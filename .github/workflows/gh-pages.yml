name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger on every push to main

# Allow the workflow to write to the repo (needed to push to gh-pages)
permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js (LTS — currently Node 20)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies (clean install, respects package-lock.json)
      - name: Install dependencies
        run: npm ci

      # 4. Build the Vite production bundle → output goes to dist/
      - name: Build
        run: npm run build

      # 5. Deploy dist/ to the gh-pages branch
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
